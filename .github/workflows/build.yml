name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        timeout-minutes: 10
      - run: npm run build:win
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: dist/*.exe

  build-mac:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        timeout-minutes: 10
      - run: npm run build:mac
        timeout-minutes: 20
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: dist/*.dmg